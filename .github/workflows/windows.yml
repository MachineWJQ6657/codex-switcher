name: Windows build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:ui
      - run: npm audit --omit=dev
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: codex-account-deck-windows
          path: release/*/*.exe
